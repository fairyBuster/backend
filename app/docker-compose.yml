services:
  api:
    build:
      context: .
      dockerfile: DockerFile

    ports:
      - "8002:8002"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://backend_client:fairyBuster555.@db:5432/backend_client
      ALEMBIC_CONFIG: /code/app/alembic.ini

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./:/code/app
      - ./images:/code/app/images

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: backend_client
      POSTGRES_USER: backend_client
      POSTGRES_PASSWORD: fairyBuster555.

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_client -d backend_client"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
